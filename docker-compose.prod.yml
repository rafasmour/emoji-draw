# Production stack, served by the shared Traefik instance on the external
# `webgateway` network at https://emoji-draw.${DOMAIN}.
# Only `web` and `reverb` join `webgateway`; everything else stays on the
# project's private network.

x-build-args: &build-args
  VITE_APP_NAME: ${APP_NAME:-Emoji Draw}
  VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:?set REVERB_APP_KEY in .env}
  VITE_REVERB_HOST: emoji-draw.${DOMAIN:?set DOMAIN in .env}
  VITE_REVERB_PORT: "443"
  VITE_REVERB_SCHEME: https

x-php: &php
  build:
    context: .
    dockerfile: ./docker/common/php-fpm/Dockerfile
    target: production
    args: *build-args
  restart: unless-stopped
  env_file:
    - .env
  environment:
    RUN_MIGRATIONS: "false"
  networks:
    - default
  depends_on:
    mongodb:
      condition: service_healthy

services:
  web:
    build:
      context: .
      dockerfile: ./docker/common/php-fpm/Dockerfile
      target: nginx
      args: *build-args
    restart: unless-stopped
    volumes:
      - laravel-storage-production:/var/www/storage:ro
    networks:
      - default
      - webgateway
    labels:
      - traefik.enable=true
      - traefik.docker.network=webgateway
      - traefik.http.routers.emoji-draw-web.rule=Host(`emoji-draw.${DOMAIN}`)
      - traefik.http.routers.emoji-draw-web.entrypoints=websecure
      - traefik.http.routers.emoji-draw-web.tls=true
      - traefik.http.routers.emoji-draw-web.tls.certresolver=myresolver
      - traefik.http.routers.emoji-draw-web.priority=1
      - traefik.http.routers.emoji-draw-web.service=emoji-draw-web
      - traefik.http.services.emoji-draw-web.loadbalancer.server.port=80
    depends_on:
      php-fpm:
        condition: service_healthy

  php-fpm:
    <<: *php
    environment:
      RUN_MIGRATIONS: "true"
    volumes:
      - laravel-storage-production:/var/www/storage
    networks:
      default:
        aliases:
          - emoji-draw-php
    healthcheck:
      test: ["CMD-SHELL", "php-fpm-healthcheck || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  reverb:
    <<: *php
    command: php artisan reverb:start
    networks:
      - default
      - webgateway
    labels:
      - traefik.enable=true
      - traefik.docker.network=webgateway
      - traefik.http.routers.emoji-draw-reverb.rule=Host(`emoji-draw.${DOMAIN}`) && PathPrefix(`/app`)
      - traefik.http.routers.emoji-draw-reverb.priority=10
      - traefik.http.routers.emoji-draw-reverb.entrypoints=websecure
      - traefik.http.routers.emoji-draw-reverb.tls=true
      - traefik.http.routers.emoji-draw-reverb.tls.certresolver=myresolver
      - traefik.http.routers.emoji-draw-reverb.service=emoji-draw-reverb
      - traefik.http.services.emoji-draw-reverb.loadbalancer.server.port=8080

  queue:
    <<: *php
    command: php artisan queue:work --tries=3

  scheduler:
    <<: *php
    command: php artisan schedule:work

  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${DB_ROOT_DATABASE}
      MONGODB_DB: ${DB_DATABASE}
      MONGODB_USER: ${DB_USERNAME}
      MONGODB_PASS: ${DB_PASSWORD}
    networks:
      - default
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s
    volumes:
      - mongodb:/data/db
      - ./database/init.sh:/docker-entrypoint-initdb.d/init.sh:ro

networks:
  webgateway:
    external: true

volumes:
  mongodb:
    driver: local
  laravel-storage-production:
    driver: local
